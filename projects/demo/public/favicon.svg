<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="masonry-angular">
  <!--
    The mark is the algorithm: three equal-width columns, blocks of unequal
    height, and no gaps left behind. It has to survive being 16px in a browser
    tab, so it is six shapes and nothing else.
  -->
  <rect width="32" height="32" rx="7" fill="#5b5bd6" />
  <g fill="#fff">
    <rect x="6" y="6" width="6" height="11" rx="1.6" />
    <rect x="6" y="19" width="6" height="7" rx="1.6" />
    <rect x="13" y="6" width="6" height="7" rx="1.6" />
    <rect x="13" y="15" width="6" height="11" rx="1.6" />
    <rect x="20" y="6" width="6" height="14" rx="1.6" />
    <rect x="20" y="22" width="6" height="4" rx="1.6" />
  </g>
</svg>
